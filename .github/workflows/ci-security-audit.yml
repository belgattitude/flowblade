name: CI-security-audit

on:
  push:
    branches:
      - main
    paths:
      - 'pnpm-lock.yaml'
      - '.github/workflows/**'

  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - '**'
    paths:
      - 'pnpm-lock.yaml'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  security-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        runtime: ['node@24']
    steps:
      - uses: actions/checkout@v7

      - name: ⚙️Install pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          runtime: ${{ matrix.runtime }}
          cache: true
          node-version-file: false

      - name: 🛡️ Check for security vulnerabilities
        run: pnpm audit --audit-level critical
