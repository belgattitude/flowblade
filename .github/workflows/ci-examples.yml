name: CI-examples

on:
  push:
    branches:
     - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - '**'

permissions:
  contents: read

jobs:
  test-examples:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        runtime: ['node@24']
    env:
      TURBO_API: 'http://127.0.0.1:9080'
      TURBO_TEAM: 'flowblade'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fetch all git history so workspace comparisons have the correct commits.
          # @link https://github.com/actions/checkout#fetch-all-history-for-all-tags-and-branches
          fetch-depth: 0

      - name: ⚙️Install pnpm and Node.js
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: {{ matrix.runtime }}
          cache: true

      - name: ⏩ TurboRepo local server
        uses: felixmosh/turborepo-gh-artifacts@118f869397261f74bc39cb8565f2d02c0ed4209f # v4.1.1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          server-token: ${{ secrets.CI_TURBO_SERVER_TOKEN }}

      - name: 🛣️ Prisma generate
        run: pnpm --filter @examples/db-sqlserver prisma-generate

      - name: 🛣️ Pre build sqlduck
        run: pnpm --filter @flowblade/sqlduck build

      - name: 🕵️ Typecheck
        run: pnpm turbo run typecheck --filter='@examples/*' --token="${{ secrets.CI_TURBO_SERVER_TOKEN }}"

      - name: 🔬 ESLint checks
        run: pnpm turbo run lint --filter='@examples/*' --token="${{ secrets.CI_TURBO_SERVER_TOKEN }}"

      - name: 🧪 Unit tests
        run: pnpm turbo run test-unit --filter='@examples/*' --token="${{ secrets.CI_TURBO_SERVER_TOKEN }}"

      - name: 🏗 Build packages
        run: pnpm turbo run build --filter='@examples/*' --token="${{ secrets.CI_TURBO_SERVER_TOKEN }}"
