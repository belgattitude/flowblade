name: CI-monorepo-integrity

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - '**'

permissions:
  contents: read

jobs:
  install-integrity:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        runtime: ['node@24']
    steps:
      - uses: actions/checkout@v7

      - name: ⚙️Install pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          runtime: ${{ matrix.runtime }}
          cache: true
          node-version-file: false

      - name: 🛟 Check monorepo duplicates
        run: pnpm dedupe --check

      - name: 🛡️ Check for security vulnerabilities
        run: pnpm audit --audit-level high

