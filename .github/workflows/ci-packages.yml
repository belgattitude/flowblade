name: CI-packages

on:
  push:
    branches:
     - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - '**'

permissions:
  contents: read

jobs:
  test-packages:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        runtime: ['node@22', 'node@24', 'node@26', 'bun@1.4.2', 'deno@lts']
    env:
      TURBO_API: 'http://127.0.0.1:9080'
      TURBO_TEAM: 'flowblade'
    steps:
      - uses: actions/checkout@v7
        with:
          # Fetch all git history so workspace comparisons have the correct commits.
          # @link https://github.com/actions/checkout#fetch-all-history-for-all-tags-and-branches
          fetch-depth: 0

      - name: ⏩ TurboRepo local server
        uses: felixmosh/turborepo-gh-artifacts@v4
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          server-token: ${{ secrets.CI_TURBO_SERVER_TOKEN }}

      - name: ⚙️Install pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          runtime: ${{ matrix.runtime }}
          cache: true
          node-version-file: false

      - name: Cache rotation keys
        id: cache-rotation
        shell: bash
        run: |
          echo "YEAR_MONTH=$(/bin/date -u "+%Y%m")" >> $GITHUB_OUTPUT

      - name: ♻️ Restore packages cache
        uses: actions/cache@v6
        with:
          path: |
            ${{ github.workspace }}/.cache
          key: ${{ runner.os }}-packages-cache-${{ steps.cache-rotation.outputs.YEAR_MONTH }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('packages/**.[jt]sx?', 'integrations/**.[jt]sx?') }}
          restore-keys: |
            ${{ runner.os }}-packages-cache-${{ steps.cache-rotation.outputs.YEAR_MONTH }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: 🕵️ Typecheck
        if: matrix.runtime == 'node@24'
        run: pnpm turbo run typecheck --filter='!@examples/*' --filter='!@docs/*' --token="${{ secrets.CI_TURBO_SERVER_TOKEN }}"

      - name: 🔬 ESLint checks
        if: matrix.runtime == 'node@24'
        run: pnpm turbo run lint --filter='!@examples/*' --filter='!@docs/*' --token="${{ secrets.CI_TURBO_SERVER_TOKEN }}"

      - name: 🧪 Unit tests (no-coverage when != node@24)
        if: matrix.runtime != 'node@24'
        run: pnpm turbo run test-unit --filter='!@examples/*' --filter='!@docs/*' --token="${{ secrets.CI_TURBO_SERVER_TOKEN }}"

      - name: 🧪 Unit tests (with coverage when == node@24)
        if: matrix.runtime == 'node@24'
        run: pnpm turbo run test-unit-coverage --filter='!@examples/*' --filter='!@docs/*'

      - name: ☂️ Codecov upload (only node-24)
        if: matrix.runtime == 'node@24'
        working-directory: ${{ github.workspace }}
        run: |
          bash .github/scripts/install-codecov.sh
          pnpm g:ci-coverage-upload
        shell: bash
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: 🧪 Unit tests (edge-runtime)
        if: matrix.runtime == 'node@24'
        run: pnpm turbo run test-unit-edge --filter='!@examples/*' --filter='!@docs/*' --token="${{ secrets.CI_TURBO_SERVER_TOKEN }}"

      - name: 🏗 Build packages
        run: pnpm turbo run build --filter='!@examples/*' --filter='!@docs/*' --token="${{ secrets.CI_TURBO_SERVER_TOKEN }}"

      - name: 📐 Check build for size-limits
        if: matrix.runtime == 'node@24'
        run: pnpm turbo run check-size --filter='!@examples/*' --filter='!@docs/*' --token="${{ secrets.CI_TURBO_SERVER_TOKEN }}"

      - name: 🛟 Check build for ecmascript compliance
        if: matrix.runtime == 'node@24'
        run: pnpm turbo run check-dist --filter='!@examples/*' --filter='!@docs/*' --token="${{ secrets.CI_TURBO_SERVER_TOKEN }}"

      - name: 🛟 Check publishable dist (arethetypeswrong,publint)
        if: matrix.runtime == 'node@24'
        run: pnpm turbo run check-pub --filter='!@examples/*' --filter='!@docs/*' --token="${{ secrets.CI_TURBO_SERVER_TOKEN }}"

      - name: 🧪 Integration tests
        if: matrix.runtime == 'node@24'
        run: pnpm turbo run test-e2e --filter='!@examples/*' --filter='!@docs/*' --token="${{ secrets.CI_TURBO_SERVER_TOKEN }}"
