name: CD-pkg-pr-new
on: [push, pull_request]

permissions: 
  contents: read

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    env:
      TURBO_API: 'http://127.0.0.1:9080'
      TURBO_TEAM: 'flowblade'

    steps:
      - uses: actions/checkout@v7

      - name: ⚙️Install pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true

      - name: ⏩ TurboRepo local server
        uses: felixmosh/turborepo-gh-artifacts@v4
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          server-token: ${{ secrets.CI_TURBO_SERVER_TOKEN }}

      - name: 🏗 Build packages
        run: pnpm turbo run build --filter='!@examples/*' --filter='!@docs/*' --token="${{ secrets.CI_TURBO_SERVER_TOKEN }}"

      - name: 📦 Publish on pkg.pr.new
        run: pnpm exec pkg-pr-new publish "./packages/*"