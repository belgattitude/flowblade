name: CI-nextjs-app-docker-bun

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - "**"

env:
  # Image built (and tagged) by the turbo task, see examples/apps/nextjs-app/docker/docker-compose*.yml
  IMAGE: flowblade-nextjs-app-bun:latest
  TURBO_TASK: docker:build-bun
  APP_PACKAGE: "@examples/nextjs-app"

permissions:
  contents: read

jobs:
  docker-bun:
    #if: ${{ github.repository == 'belgattitude/flowblade' && contains('refs/heads/main',github.ref)}}
    runs-on: ubuntu-latest
    name: nextjs-app bun example docker build
    env:
      TURBO_API: "http://127.0.0.1:9080"
      TURBO_TEAM: "flowblade"
      # Dependencies aren't installed on the runner (the image installs them),
      # turbo runs the docker task through pnpm without checking node_modules.
      PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: "false"
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fetch all git history so turbo can find the affected packages.
          # @link https://github.com/actions/checkout#fetch-all-history-for-all-tags-and-branches
          fetch-depth: 0
          persist-credentials: false

      - name: ⏩ TurboRepo local server
        uses: felixmosh/turborepo-gh-artifacts@118f869397261f74bc39cb8565f2d02c0ed4209f # v4.1.1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          server-token: ${{ secrets.CI_TURBO_SERVER_TOKEN }}

      - name: ⚙️Install pnpm and Node.js
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@24
          cache: false
          node-version-file: false
          # turbo only needs the manifests and the lockfile, dependencies are
          # installed inside the docker image
          install: false

      - name: ⚙️ Install turbo
        # Same version as the root package.json
        run: pnpm install --global "turbo@$(jq -r '.devDependencies.turbo' package.json)"

      - name: 🔎 Check if the app is affected
        id: affected
        env:
          # The checkout only has remote refs (origin/main), turbo would otherwise
          # look for a local `main` branch and assume everything changed.
          # PR: compare with the target branch, push: with the previous tip.
          TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          count=$(turbo query affected --packages "${APP_PACKAGE}" --tasks "${TURBO_TASK}" | jq '.data.affectedTasks.length')
          echo "Affected tasks: ${count}"
          if [ "${count}" -gt 0 ]; then
            echo "affected=true" >> "$GITHUB_OUTPUT"
          else
            echo "affected=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${APP_PACKAGE} is not affected by the changes, docker build skipped"
          fi

      - name: 🤫 Login to Docker Hub
        # Disabled for example
        if: false
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🏗 Build docker image
        if: steps.affected.outputs.affected == 'true'
        run: turbo run "${TURBO_TASK}" --filter="${APP_PACKAGE}" --log-prefix=none --token="${{ secrets.CI_TURBO_SERVER_TOKEN }}"

      - name: 🕵️ Docker image inspect
        if: steps.affected.outputs.affected == 'true'
        run: docker image inspect "${IMAGE}"

      - name: 📊 Docker image statistics
        if: steps.affected.outputs.affected == 'true'
        run: |
          size_bytes=$(docker image inspect "${IMAGE}" --format '{{.Size}}')
          layers=$(docker image inspect "${IMAGE}" --format '{{len .RootFS.Layers}}')
          platform=$(docker image inspect "${IMAGE}" --format '{{.Os}}/{{.Architecture}}')
          size_mb=$(awk -v b="${size_bytes}" 'BEGIN { printf "%.1f", b / 1024 / 1024 }')
          {
            echo "### 🐳 ${IMAGE}"
            echo ""
            echo "| Platform | Size (uncompressed) | Layers |"
            echo "| --- | --- | --- |"
            echo "| ${platform} | ${size_mb} MB | ${layers} |"
            echo ""
            echo "<details><summary>Largest layers</summary>"
            echo ""
            echo '```'
            docker history "${IMAGE}" --no-trunc --human=false --format '{{.Size}}\t{{.CreatedBy}}' \
              | sort -rn \
              | head -n 10 \
              | awk -F '\t' '$1 > 0 { cmd = $2; if (length(cmd) > 100) cmd = substr(cmd, 1, 97) "..."; printf "%8.1f MB  %s\n", $1 / 1024 / 1024, cmd }'
            echo '```'
            echo ""
            echo "</details>"
          } | tee -a "${GITHUB_STEP_SUMMARY}"
