packages:
  - docs
  - examples/*/*
  - packages/*
  - tools/*

nodeLinker: isolated
packageImportMethod: auto
savePrefix: ""

#autoDedupe: true

lockfile:
  integrityTarget: tar
# uncomment when turbo repo prune supports the settings entry in pnpm lock
# includeResolutionSettings: true

autoInstallPeers: false
strictPeerDependencies: false
resolvePeersFromWorkspaceRoot: true
dedupePeers: true
# This fixes most typescript errors because of missing peer @types/*
addMissingPeerTypes: true

forceIgnoresPlatform: false
ignoreCompatibilityDb: false

# Set it to true for deno
preferSymlinkedExecutables: true
resolutionMode: highest
optimisticRepeatInstall: true
trustPolicy: no-downgrade
trustPolicyExcludePrune: true
trustPolicyExclude:
  - "@pierre/theme@2.0.0"
  - "@vercel/*"
  - "semver@6.3.1"
  - "undici-types@6.21.0"
  - "prisma"
  - "lefthook@2.2.2"

verifyDepsBeforeRun: install

# pnpm 12.9.1 has an issue still that makes every run command
# running postinstall scripts, even id virtualStoreType is project
enableGlobalVirtualStore: false
#https://github.com/pnpm/pnpm/issues/14972
virtualStoreType: project

# nextjs standalone build requires this to be hoisted without symlinks
# publicHoistPattern:
# Next.js Image Optimization Binaries (Sharp & libvips engines)
#  - "sharp"
#  - "@img/*"

# Database Engines & Native Clients
#  - "prisma"
#  - "@prisma/client"
#  - ".prisma/*"

# Duckdb
# - "@duckdb/*"

supportedArchitectures:
  os:
    - current
  cpu:
    - current
  libc:
    - current

allowBuilds:
  "@prisma/client": false
  "@prisma/engines": false
  core-js: false
  cpu-features: false
  es5-ext: false
  esbuild: true
  lefthook: false
  prisma: false
  protobufjs: false
  ssh2: false

strictDepBuilds: false

permissions:
  "@logtape/logtape":
    skills: false
  blume:
    skills: false
  ultracite:
    skills: false
#skills:
#  dirs:
#    - .claude/skills
#    - .codex/skills

audit:
  ignore:
    - GHSA-vfj7-8cjw-p6xm
    - GHSA-hp3w-g68c-fv3c

overrides:
  "@azure/msal-node@>=5.0.0-beta.0 <7.1.0": 7.1.2
  "@opentelemetry/core@<2.8.0": 2.8.0
  "@xmldom/xmldom@>=0.9.0 <=0.9.10": 0.9.12
  "@xmldom/xmldom@>=0.9.0 <=0.9.11": 0.9.12
  "@xmldom/xmldom@>=0.9.0-beta.1 <=0.9.11": 0.9.12
  "@xmldom/xmldom@>=0.9.0-beta.9 <=0.9.10": 0.9.12
  "@xmldom/xmldom@>=0.9.10 <=0.9.11": 0.9.12
  body-parser@>=2.0.0 <2.4.0: 2.4.0
  deepmerge-ts@<8.0.0: 8.0.2
  esbuild: ^0.28.2
  http-cache-semantics@<=4.2.0: 4.3.0
  katex@>=0.11.0 <0.18.2: 0.18.2
  lodash-es@<=4.17.23: 4.18.1
  lodash-es@>=4.0.0 <=4.17.23: 4.18.1
  mysql2@<=3.23.0: 3.24.5
  path-to-regexp@>=4.0.0 <6.3.0: 6.3.0
  postcss-selector-parser@<7.1.6: 7.1.7
  seroval@<=1.6.2: 1.7.3
  zod@<4.6.6: 4.6.7

minimumReleaseAge: 2880
minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - "@azure/*"
  - "@better-auth/*"
  - "@duckdb/*"
  - "@hono/*"
  - "@httpx/*"
  - "@logtape/*"
  - "@napi-rs/*"
  - "@next/*"
  - "@oxc-project/*"
  - "@oxfmt/*"
  - "@oxlint-tsgolint/*"
  - "@oxlint/*"
  - "@shadcn/*"
  - "@turbo/*"
  - "@vitejs/*"
  - better-auth
  - better-call
  - hono
  - kysely
  - next
  - oxfmt
  - oxlint
  - shadcn
  - vite
  - vitest
  - zod
  - turbo
  - oxlint-tsgolint
  - http-cache-semantics@4.3.0
