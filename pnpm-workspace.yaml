packages:
  - docs
  - examples/*/*
  - integrations/*
  - packages/*

# Use pnpm's symlinked node_modules layout rather than Yarn PnP.
nodeLinker: isolated
packageImportMethod: auto
savePrefix: ''
#autoDedupe: true
forceIgnoresPlatform: false
ignoreCompatibilityDb: true
autoInstallPeers: false
strictPeerDependencies: false
resolvePeersFromWorkspaceRoot: true
dedupePeers: true
# Set it to true for deno
preferSymlinkedExecutables: true
resolutionMode: highest
optimisticRepeatInstall: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - '@pierre/theme@2.0.0'
  - '@vercel/oidc@3.8.9'
  - '@vercel/cli-config@0.3.0'
  - '@vercel/cli-exec@1.0.1'
  - '@vercel/functions@3.9.9'
  - '@vercel/routing-utils@6.6.0'
  - 'semver@6.3.1'
  - 'undici-types@6.21.0'
  - 'chokidar@4.0.3'
  - 'why-is-node-running@3.2.2'
  - 'prisma@7.10.0'
  - 'reselect@5.1.1'

verifyDepsBeforeRun: install

#https://github.com/pnpm/pnpm/issues/14972
virtualStoreType: project

# nextjs standalone build requires this to be hoisted without symlinks
# publicHoistPattern:
  # Next.js Image Optimization Binaries (Sharp & libvips engines)
#  - "sharp"
#  - "@img/*"

  # Database Engines & Native Clients
#  - "prisma"
#  - "@prisma/client"
#  - ".prisma/*"

  # Duckdb
# - "@duckdb/*"

supportedArchitectures:
  os:
    - current
  cpu:
    - current
  libc:
    - current

allowBuilds:
  '@prisma/client': false
  '@prisma/engines': false
  core-js: false
  cpu-features: false
  es5-ext: false
  esbuild: true
  lefthook: false
  prisma: false
  protobufjs: false
  ssh2: false

strictDepBuilds: false

audit:
  ignore:
    - GHSA-vfj7-8cjw-p6xm
    - GHSA-86w9-cpqp-85rv

overrides:
  '@opentelemetry/core@<2.8.0': 2.8.0
  '@xmldom/xmldom@>=0.9.0 <=0.9.10': 0.9.12
  '@xmldom/xmldom@>=0.9.0 <=0.9.11': 0.9.12
  '@xmldom/xmldom@>=0.9.0-beta.1 <=0.9.11': 0.9.12
  '@xmldom/xmldom@>=0.9.0-beta.9 <=0.9.10': 0.9.12
  '@xmldom/xmldom@>=0.9.10 <=0.9.11': 0.9.12
  deepmerge-ts@<8.0.0: 8.0.0
  esbuild: ^0.28.2
  lodash-es@<=4.17.23: 4.18.1
  lodash-es@>=4.0.0 <=4.17.23: 4.18.1
  mysql2@<=3.23.0: 3.24.5

# Keep the existing supply-chain cooldown while allowing trusted packages immediately.
minimumReleaseAge: 2880
minimumReleaseAgeExclude:
  - '@azure/*'
  - '@better-auth/*'
  - '@duckdb/*'
  - '@hono/*'
  - '@httpx/*'
  - '@logtape/*'
  - '@napi-rs/*'
  - '@next/*'
  - '@oxc-project/*'
  - '@oxfmt/*'
  - '@oxlint-tsgolint/*'
  - '@oxlint/*'
  - '@shadcn/*'
  - '@turbo/*'
  - better-auth
  - better-call
  - hono
  - kysely
  - next
  - oxfmt
  - oxlint
  - shadcn
  - vite
  - vitest
  - zod
  - turbo
  - oxlint-tsgolint
